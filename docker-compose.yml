name: immich-tg

services:
  immich-tg:
    build: .
    image: immich-tg:latest
    env_file: .env
    restart: unless-stopped
    # Room for a failed Video's outcome and then the stopped message, each
    # allowed 5s once shutdown has begun, before Docker kills the process.
    stop_grace_period: 15s
    networks:
      - telegram-bot-api

networks:
  # Shared with the Telegram Bot API server project; create it once with
  # `docker network create telegram-bot-api`.
  telegram-bot-api:
    external: true
